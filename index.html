  <style>
    :root {
      --executive-navy: #0F2B48;
      --brushed-gold: #C5A059;
      --brushed-gold-hover: #b08d48;
      --warm-studio-paper: #F8F6F0;
      --navy-light: #163c63;
      --text-dark: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --white: #FFFFFF;
      --shadow-sm: 0 1px 3px rgba(15, 43, 72, 0.08);
      --shadow-md: 0 4px 12px rgba(15, 43, 72, 0.1);
      --shadow-lg: 0 10px 25px rgba(15, 43, 72, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
      color: var(--text-dark);
      background-color: var(--warm-studio-paper);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Navigation Header */
    header {
      background-color: var(--executive-navy);
      color: var(--white);
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--brushed-gold);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--white);
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      background: var(--executive-navy);
      border: 2px solid var(--brushed-gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--brushed-gold);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .logo-subtitle {
      font-size: 0.65rem;
      color: var(--brushed-gold);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.75rem;
      align-items: center;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--brushed-gold);
    }

    .btn-primary {
      background-color: var(--brushed-gold);
      color: var(--executive-navy);
      padding: 0.65rem 1.35rem;
      border-radius: 4px;
      font-weight: 700;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
      border: none;
      cursor: pointer;
      display: inline-block;
    }

    .btn-primary:hover {
      background-color: var(--brushed-gold-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--executive-navy);
      padding: 0.65rem 1.35rem;
      border-radius: 4px;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid var(--executive-navy);
      transition: all 0.2s;
      cursor: pointer;
      display: inline-block;
    }

    .btn-secondary:hover {
      background-color: var(--executive-navy);
      color: var(--white);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, var(--executive-navy) 0%, var(--navy-light) 100%);
      color: var(--white);
      padding: 4.5rem 2rem 5rem;
      text-align: center;
      position: relative;
    }

    .hero-content {
      max-width: 850px;
      margin: 0 auto;
    }

    .badge-gold {
      background-color: rgba(197, 160, 89, 0.15);
      color: var(--brushed-gold);
      border: 1px solid var(--brushed-gold);
      padding: 0.35rem 1rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 1.25rem;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.25rem;
    }

    .hero p {
      font-size: 1.15rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2rem;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }

    .hero-cta {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    /* Section Header */
    .section-header {
      text-align: center;
      max-width: 700px;
      margin: 4rem auto 2.5rem;
      padding: 0 1rem;
    }

    .section-header h2 {
      font-size: 2rem;
      color: var(--executive-navy);
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Packages Grid - 4 Column Layout */
    .packages-container {
      max-width: 1300px;
      margin: 0 auto 1.5rem;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1.5rem;
    }

    .package-card {
      background: var(--white);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .package-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .package-card.featured {
      border: 2px solid var(--brushed-gold);
      box-shadow: var(--shadow-md);
    }

    .package-card.custom-card {
      background-color: #f1f5f9;
      border: 2px dashed var(--executive-navy);
    }

    .featured-tag {
      background: var(--brushed-gold);
      color: var(--executive-navy);
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      padding: 0.35rem;
      letter-spacing: 1px;
    }
