      border-bottom: 3px solid var(--brushed-gold);
    }

    }

      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--white);
    }

      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--brushed-gold);
    }

      display: flex;
      flex-direction: column;
